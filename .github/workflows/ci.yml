name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python (jsonschema) — schema, vectors, sanitize, standard example
        run: uvx --with jsonschema --with pytest pytest -q tests
      - name: Command line (check-jsonschema) — every valid file accepted, every invalid rejected
        run: make check
